<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking Analytics Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            color: #123b63;
        }

        header {
            background: #123b63;
            color: white;
            padding: 22px;
            text-align: center;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 12px;
        }

        .container {
            max-width: 1000px;
            margin: 35px auto;
            padding: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card, .chart-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #555;
            margin-bottom: 15px;
        }

        .card p {
            font-size: 30px;
            font-weight: bold;
            color: #1593b5;
        }

        .chart-box h2 {
            margin-bottom: 25px;
        }

        .bar-row {
            margin: 20px 0;
        }

        .bar-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .bar-background {
            background: #e4edf4;
            height: 18px;
            border-radius: 10px;
            overflow: hidden;
        }

        .bar {
            height: 100%;
            width: 0;
            background: #1593b5;
            border-radius: 10px;
            transition: width 0.5s;
        }

        #status {
            margin: 20px 0;
            color: #2673a8;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>Banking Analytics Dashboard</h1>
    <p>Banking Customer Satisfaction Report</p>

    <nav>
        <a href="index.html">Home</a>
        <a href="survey.html">Survey</a>
        <a href="analytics.html">Analytics</a>
    </nav>
</header>

<div class="container">

    <div id="status">Loading analytics...</div>

    <div class="cards">

        <div class="card">
            <h3>Total Customers</h3>
            <p id="customers">0</p>
        </div>

        <div class="card">
            <h3>Total Responses</h3>
            <p id="responses">0</p>
        </div>

        <div class="card">
            <h3>Customer Satisfaction</h3>
            <p id="satisfaction">0%</p>
        </div>

    </div>

    <div class="chart-box">
        <h2>Customer Satisfaction Analysis</h2>

        <div id="chart"></div>
    </div>

</div>

<footer>
    Banking Survey and Analytics Project
</footer>

<script>

async function loadAnalytics() {

    const status = document.getElementById("status");

    try {

        const response = await fetch("http://127.0.0.1:8000/analytics");

        if (!response.ok) {
            throw new Error("Unable to load analytics");
        }

        const data = await response.json();

        document.getElementById("customers").textContent =
            data.total_customers;

        document.getElementById("responses").textContent =
            data.total_responses;

        document.getElementById("satisfaction").textContent =
            data.satisfaction_percentage + "%";

        const categories = [
            ["Very Satisfied", data.very_satisfied],
            ["Satisfied", data.satisfied],
            ["Neutral", data.neutral],
            ["Dissatisfied", data.dissatisfied],
            ["Very Dissatisfied", data.very_dissatisfied]
        ];

        const chart = document.getElementById("chart");

        chart.innerHTML = "";

        const maximum = Math.max(
            ...categories.map(item => item[1]),
            1
        );

        categories.forEach(item => {

            const percentage = (item[1] / maximum) * 100;

            chart.innerHTML += `
                <div class="bar-row">
                    <div class="bar-label">
                        <span>${item[0]}</span>
                        <strong>${item[1]}</strong>
                    </div>

                    <div class="bar-background">
                        <div class="bar"
                             style="width: ${percentage}%">
                        </div>
                    </div>
                </div>
            `;

        });

        status.textContent = "Analytics loaded successfully!";

    } catch (error) {

        status.textContent =
            "Unable to connect. Please check whether the backend is running.";

    }
}

loadAnalytics();

</script>

</body>
</html>
